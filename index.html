<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pseudocode IDE</title>
<meta name="description" content="Pseudocode IDE: an editor with a built-in interpreter for Cambridge IGCSE and AS & A Level pseudocode, running in your browser. Made by @imdaclassic.">
<meta name="author" content="imdaclassic">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23333'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23fff' font-family='monospace'%3EP%3C/text%3E%3C/svg%3E">
<script>
  // Apply saved theme before first paint.
  try { const t = localStorage.getItem("pc.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="vendor/codemirror.js">
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<header class="topbar">
  <button class="icon-btn only-narrow" id="toggle-files" title="Show files" aria-label="Show files">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
  </button>
  <span class="app-name" title="An IDE with a built-in interpreter for Cambridge pseudocode">Pseudocode IDE</span>
  <span class="tagline">with built-in interpreter</span>
  <span class="file-name" id="file-name"></span>
  <div class="seg" id="mode" role="radiogroup" aria-label="Syllabus">
    <button role="radio" data-mode="igcse" title="Cambridge IGCSE / O Level (0478, 0984, 2210)">IGCSE</button>
    <button role="radio" data-mode="as" title="Cambridge International AS & A Level (9618)">AS &amp; A Level</button>
  </div>
  <button class="btn primary" id="run" title="Run (Ctrl+Enter)">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    <span>Run</span>
  </button>
  <button class="btn" id="stop" title="Stop" hidden>
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="currentColor"/></svg>
    <span>Stop</span>
  </button>
  <span class="spacer"></span>
  <a class="credit" href="https://github.com/imdaclassic" target="_blank" rel="noopener" title="imdaclassic on GitHub">by @imdaclassic</a>
  <a class="icon-btn" href="https://github.com/imdaclassic/pseudocode-interpreter-IDE" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <button class="btn ghost" id="toggle-ref" title="Syntax reference (F1)" aria-label="Reference">
    <svg class="only-narrow" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 2.5h4a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 2.5h-4A1.5 1.5 0 0 0 8 4v9.5a1.5 1.5 0 0 1 1.5-1.5h4z" stroke="currentColor" fill="none"/></svg>
    <span>Reference</span>
  </button>
  <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
  </button>
</header>

<main class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <button class="ws-name" id="ws-name" title="Rename workspace">
      <span class="ws-label">Workspace</span>
      <span class="ws-title" id="ws-title"></span>
      <svg class="ws-edit" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z M9 4l3 3" stroke="currentColor" fill="none"/></svg>
    </button>
    <div class="panel-head">
      <span>Files</span>
      <span class="spacer"></span>
      <button class="icon-btn sm" id="new-file" title="New file" aria-label="New file">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 1.5h6l4 4v9H3z M9 1.5v4h4" stroke="currentColor" fill="none"/><path d="M8 8v5M5.5 10.5h5" stroke="currentColor"/></svg>
      </button>
      <button class="icon-btn sm" id="new-folder" title="New folder" aria-label="New folder">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1.5 3.5h5l1.5 1.5h6.5v8.5h-13z" stroke="currentColor" fill="none"/><path d="M8 7v5M5.5 9.5h5" stroke="currentColor"/></svg>
      </button>
      <button class="icon-btn sm" id="upload" title="Upload files" aria-label="Upload files">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3" stroke="currentColor" fill="none"/></svg>
      </button>
      <button class="icon-btn sm" id="ws-menu-btn" title="More" aria-label="More workspace actions">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="3" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/></svg>
      </button>
      <input type="file" id="upload-input" multiple hidden>
      <input type="file" id="import-input" accept=".pseudows,.json" hidden>
    </div>
    <div class="tree" id="tree" role="tree" tabindex="0"></div>
    <div class="sidebar-foot">
      <button class="btn sm" id="ws-save" title="Download all files as one workspace file">Save</button>
      <button class="btn sm" id="ws-load" title="Open a saved workspace file (replaces current files)">Load</button>
      <span class="spacer"></span>
      <button class="btn sm ghost danger" id="ws-clear" title="Delete all files">Clear</button>
    </div>
  </aside>

  <section class="center">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="editor" id="editor"></div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to resize"></div>
    <div class="console-wrap">
      <div class="panel-head">
        <span>Console</span>
        <span class="status" id="status"></span>
        <span class="spacer"></span>
        <button class="btn ghost sm" id="clear">Clear</button>
      </div>
      <div class="console" id="console" tabindex="-1" aria-live="polite"></div>
    </div>
  </section>

  <aside class="refpanel" id="refpanel" hidden>
    <div class="panel-head">
      <span>Reference</span>
      <span class="ref-mode" id="ref-mode"></span>
      <span class="spacer"></span>
      <button class="icon-btn sm" id="close-ref" title="Close" aria-label="Close reference">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <input class="ref-search" id="ref-search" type="search" placeholder="Search (e.g. FOR, MID, OPENFILE)">
    <div class="ref-body" id="ref-body"></div>
  </aside>
</main>

<div class="menu" id="menu" hidden></div>
<div class="dialog-backdrop" id="dialog" hidden>
  <form class="dialog" id="dialog-form">
    <label id="dialog-label" for="dialog-input"></label>
    <input id="dialog-input" autocomplete="off" spellcheck="false">
    <p class="dialog-msg" id="dialog-msg"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="dialog-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="dialog-ok">OK</button>
    </div>
  </form>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
